
services:
  postgres:
    image: postgres:17
    container_name: todo_postgres
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
    ports:
      - "5432:5432"
    volumes:
      - todo_data:/var/lib/postgresql/data

volumes:
  todo_data:
